name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aerogard
          POSTGRES_PASSWORD: aerogard_ci_password
          POSTGRES_DB: aerogard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aerogard -d aerogard_test"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://aerogard:aerogard_ci_password@localhost:5432/aerogard_test
      JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations have no pending model changes
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic upgrade head && alembic check
      - name: Tests
        run: pytest
